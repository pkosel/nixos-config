name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bridget:
    runs-on: native
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the flake
        run: |
          set -euo pipefail
          nix flake check --no-update-lock-file

      - name: Build bridget without activating
        run: |
          set -euo pipefail
          nix build --no-update-lock-file \
            --out-link "$HOME/bridget" \
            .#nixosConfigurations.bridget.config.system.build.toplevel
          nix path-info --closure-size --human-readable "$HOME/bridget"
